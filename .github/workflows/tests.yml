name: Tests
on:
  push:
  pull_request:
  schedule:
    - cron: "0 14 * * 1"   # every Monday, so out-of-date campus numbers get flagged
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4   # provides the Kotlin compiler used by run-kotlin-checks.sh
        with: { gradle-version: "8.14.3" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Detection logic (each simulated night 100 times)
        run: SEEDS=100 node tests/simulate-nights.mjs
      - name: Text relay
        run: node relay/test.js
      - name: Campus list
        run: node tests/check-campuses.mjs
      - name: Android shared code, replayed against the recorded nights
        run: bash tests/run-kotlin-checks.sh
      - name: Web prototype in Chrome
        run: |
          pip install playwright==1.48.0
          python tests/prototype_test.py
